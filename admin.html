<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F0EA">
<title>Панель WeDesign</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap&subset=cyrillic,latin">
<link rel="stylesheet" href="/assets/style.css">
<meta name="format-detection" content="telephone=no">
<style>
  .panel{max-width:1080px;margin:0 auto;padding:40px 22px 80px}
  .login{max-width:400px;margin:14vh auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
  .order.hot{box-shadow:var(--sh-1),inset 0 0 0 2px var(--amber)}
  .order-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .tag{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:5px 11px;border-radius:999px;background:#ffffff14;color:var(--muted)}
  .tag.claimed{background:#A4610C1A;color:var(--amber)}
  .tag.paid{background:#12704A1A;color:var(--ok)}
  .tag.rejected{background:#ff7a6b2e;color:var(--danger)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}
  .kv span{display:block;font-size:12px;color:var(--muted)}
  .kv b{font-size:16px;font-weight:600}
  .risk{background:#ff7a6b1a;border:1px solid #ff7a6b55;border-radius:10px;padding:12px 16px;font-size:14.5px;margin:14px 0}
  .risk ul{margin:6px 0 0;padding-left:18px}
  .steps-check{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:14.5px;color:var(--muted);margin:14px 0}
  .steps-check b{color:var(--text)}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap}
  .chain{background:var(--soft);border-radius:12px;padding:16px 18px;margin:14px 0;font-size:14.5px}
  .chain>b{display:block;margin-bottom:10px}
  .chain-row{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .chain-row span{color:var(--mu);font-size:13.5px}
  /* ——— телефон ——— */
  @media(max-width:820px){
    .panel{padding:22px 16px 60px}
    .bar{flex-direction:column;align-items:stretch;gap:14px}
    .bar .row-actions{width:100%}
    .bar .row-actions .btn,.bar .row-actions a{flex:1;text-align:center;justify-content:center}
    .lookup{flex-direction:column;align-items:stretch;padding:16px 18px}
    .lookup-row{width:100%}
    .lookup input{width:100%;flex:1}
    .filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;-webkit-overflow-scrolling:touch}
    .filters .chip-btn{white-space:nowrap;flex-shrink:0}
    .order{padding:18px 16px}
    .order-top{flex-direction:column;gap:8px}
    .kv{grid-template-columns:1fr 1fr;gap:12px}
    .row-actions{gap:8px}
    .row-actions .btn,.row-actions a.btn{flex:1 1 100%;justify-content:center;text-align:center}
    .chain-row{grid-template-columns:1fr;gap:2px}
    .steps-check,.risk{font-size:14px;padding:12px 14px}
    .acc-out{padding:16px}
    .acc-out td{display:block;padding:4px 0;border:0}
    .acc-out td:first-child{width:auto;font-size:12px;padding-top:10px}
    .acc-out tr{display:block;border-bottom:1px solid var(--line);padding-bottom:8px}
    .acc-out tr:last-child{border-bottom:0}
    dialog{width:100vw;max-width:100vw;height:100vh;max-height:100vh;border-radius:0;margin:0}
    dialog iframe{height:calc(100vh - 58px)}
    .dlg-bar{padding:12px 14px}
    .login{margin:6vh auto;padding:24px 20px}
  }
  @media(max-width:420px){
    .kv{grid-template-columns:1fr}
    .order-top .tag{align-self:flex-start}
  }
  .lookup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .lookup-row{display:flex;gap:9px;flex-wrap:wrap}
  .lookup input{background:var(--soft);border:1.5px solid transparent;border-radius:10px;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--ink);width:210px}
  .lookup input:focus{border-color:var(--ac);background:var(--card);outline:none}
  .acc-out{background:var(--card);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--sh-1)}
  .acc-out.bad{box-shadow:inset 0 0 0 2px var(--danger)}
  .acc-out.ok{box-shadow:inset 0 0 0 2px var(--ok)}
  .acc-out h3{margin-bottom:14px}
  .acc-out table{width:100%;border-collapse:collapse;font-size:14.5px}
  .acc-out td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .acc-out td:first-child{color:var(--mu);width:36%}
  .acc-out tr:last-child td{border-bottom:0}
  .verdict{font-weight:700;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:15px}
  .verdict.ok{background:#15803D14;color:var(--ok)}
  .verdict.bad{background:#B3271B14;color:var(--danger)}
  dialog{background:var(--ink-2);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:0;width:min(1000px,94vw);max-height:92vh}
  dialog iframe{width:100%;height:76vh;border:0;background:#fff;display:block}
  .dlg-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h2 style="font-size:24px">Панель WeDesign</h2>
  <p class="micro" style="margin-bottom:20px">Вход только по паролю. Пароль хранится в переменных Vercel, в коде его нет.</p>
  <label class="field"><span>Пароль</span><input type="password" id="pw" autocomplete="current-password"></label>
  <button class="btn" id="btnLogin" style="width:100%">Войти</button>
  <div class="notice" id="loginErr" hidden></div>
</div>

<div class="panel" id="panel" hidden>
  <div class="bar">
    <div>
      <h2 style="font-size:26px;margin-bottom:4px">Заказы</h2>
      <p class="micro" id="meta">—</p>
    </div>
    <div class="row-actions">
      <a class="btn btn-ghost btn-sm" id="kaspiOpen" target="_blank" rel="noopener">Открыть Kaspi</a>
      <button class="btn btn-ghost btn-sm" id="btnReload">Обновить</button>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Выйти</button>
    </div>
  </div>

  <div class="lookup">
    <div>
      <b>Проверить расписку о согласии</b>
      <p class="micro" style="margin:4px 0 0">Введите номер вида ACC-XXXXXXXX — покажем, что и когда принял клиент, и цела ли подпись.</p>
    </div>
    <div class="lookup-row">
      <input id="accId" placeholder="ACC-WM8N97W5" maxlength="20">
      <button class="btn btn-sm" id="btnAcc">Проверить</button>
    </div>
  </div>
  <div class="acc-out" id="accOut" hidden></div>

  <div class="filters">
    <button class="chip-btn" data-f="claimed">Ждут проверки</button>
    <button class="chip-btn" data-f="awaiting_payment">Ждут оплату</button>
    <button class="chip-btn" data-f="paid">Оплаченные</button>
    <button class="chip-btn" data-f="all">Все</button>
  </div>

  <div id="list"></div>
</div>

<dialog id="dlg">
  <div class="dlg-bar"><b class="mono" id="dlgTitle">—</b><button class="btn btn-ghost btn-sm" id="dlgClose">Закрыть</button></div>
  <iframe id="dlgFrame" title="Предпросмотр сайта"></iframe>
</dialog>

<script src="/assets/admin.js"></script>
</body>
</html>
